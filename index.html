<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Shopping App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#18202a}
header{background:#fff;padding:16px 5%;display:flex;gap:20px;align-items:center;position:sticky;top:0;z-index:2;box-shadow:0 2px 10px #0001}
.logo{font-size:25px;font-weight:800}.logo span{color:#ff5a1f}
.search{flex:1;max-width:650px;padding:13px 16px;border:1px solid #ddd;border-radius:10px}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer}.orange{background:#ff5a1f;color:white}
.hero{margin:25px 5%;padding:40px;border-radius:18px;background:linear-gradient(110deg,#ff5a1f,#ff9a3d);color:white}
.hero h1{font-size:38px;margin:0 0 10px}.hero p{font-size:18px}
section{margin:25px 5%}.cats,.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.card{background:white;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0000000d}
.cat{text-align:center;font-weight:bold}.icon{font-size:40px;margin-bottom:8px}
.product img{width:100%;height:150px;object-fit:contain}.price{font-size:20px;font-weight:800;margin:8px 0}.old{text-decoration:line-through;color:#888;font-size:13px}
.cart{position:fixed;right:20px;bottom:20px;background:#ff5a1f;color:white;border-radius:50px;padding:15px 20px;font-weight:bold}
@media(max-width:650px){header{flex-wrap:wrap}.search{order:3;flex-basis:100%}.hero{padding:25px}.hero h1{font-size:28px}}
</style>
</head>
<body>
<header>
  <div class="logo">Shop<span>Ease</span></div>
  <input class="search" placeholder="Search for products, brands and more..." id="search" oninput="filterProducts()">
  <button>♡ Wishlist</button>
  <button class="orange" onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<div class="hero">
  <h1>Big Deals, Easy Shopping</h1>
  <p>Top products पर शानदार offers — आज ही ShopEase पर खरीदें।</p>
  <button onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
</div>

<section>
<h2>Top Categories</h2>
<div class="cats">
  <div class="card cat"><div class="icon">📱</div>Electronics</div>
  <div class="card cat"><div class="icon">👕</div>Fashion</div>
  <div class="card cat"><div class="icon">🛋️</div>Home & Kitchen</div>
  <div class="card cat"><div class="icon">💄</div>Beauty</div>
  <div class="card cat"><div class="icon">👟</div>Sports</div>
  <div class="card cat"><div class="icon">🎮</div>Gaming</div>
</div>
</section>

<section id="products">
<h2>Deals of the Day</h2>
<div class="products" id="grid"></div>
</section>

<div class="cart" onclick="showCart()">🛒 Cart: <span id="cartTotal">₹0</span></div>

<script>
const products=[
{name:"Smart Watch",price:1699,old:2299,img:"⌚"},
{name:"Running Shoes",price:1749,old:2499,img:"👟"},
{name:"Wireless Headphones",price:1299,old:1999,img:"🎧"},
{name:"Backpack",price:999,old:1299,img:"🎒"},
{name:"Hair Dryer",price:999,old:1449,img:"💨"},
{name:"Bluetooth Speaker",price:1499,old:2199,img:"🔊"}
];
let cart=[];
function render(list=products){
 grid.innerHTML=list.map((p,i)=>`<div class="card product">
<div style="font-size:70px;text-align:center;height:150px;display:grid;place-items:center">${p.img}</div>
<h3>${p.name}</h3><div class="price">₹${p.price}</div><div class="old">₹${p.old}</div>
<button class="orange" style="width:100%;margin-top:10px" onclick="add(${i})">Add to Cart</button>
</div>`).join("");
}
function add(i){cart.push(products[i]);update();alert(products[i].name+" cart में जोड़ दिया गया");}
function update(){count.textContent=cart.length;cartTotal.textContent="₹"+cart.reduce((s,p)=>s+p.price,0).toLocaleString("en-IN")}
function showCart(){alert(cart.length?`Cart में ${cart.length} item हैं। Total: ₹${cart.reduce((s,p)=>s+p.price,0).toLocaleString("en-IN")}`:"Cart अभी खाली है।")}
function filterProducts(){let q=search.value.toLowerCase();render(products.filter(p=>p.name.toLowerCase().includes(q)))}
render();update();
</script>
</body>
</html>
